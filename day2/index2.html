<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechBootcamp</title>
    <link rel="stylesheet" href="sty.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .title {
            color: #6366f1;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .box {
            margin-bottom: 2rem;
        }

        .box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .box ul li {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            color: #0369a1;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 4px solid #0369a1;
            box-shadow: 0 4px 15px rgba(3, 105, 161, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .box ul li:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(3, 105, 161, 0.2);
        }

        .alerts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .alert {
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .alert:hover {
            transform: translateY(-4px);
        }

        .alert.info {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 2px solid #0369a1;
        }

        .alert.error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #991b1b;
        }

        .alert.warning {
            background-color: #fef3c7;
            color: #92400e;
            border: 2px solid #92400e;
        }

        .alert.success {
            background-color: #dcfce7;
            color: #15803d;
            border: 2px solid #15803d;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <h2 class="title">What You Will Do</h2>
            <ul>
                <li>✓ Meet the instructional team</li>
                <li>✓ Review the program structure</li>
                <li>✓ See beginner-friendly HTML examples</li>
            </ul>
        </div>

        <div class="alerts-container">
            <div class="alert info">ℹ️ Information</div>
            <div class="alert error">❌ Error</div>
            <div class="alert warning">⚠️ Warning</div>
            <div class="alert success">✅ Success</div>
        </div>
    </div>
</body>
</html>
