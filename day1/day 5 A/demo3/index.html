<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Form Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <h1 class="header-title">Professional Application</h1>
            <p class="header-subtitle">Submit your information with ease</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <div class="content-wrapper">
            <!-- Form Section (Left Column) -->
            <section class="form-section">
                <div class="section-header">
                    <h2>Submit Form</h2>
                </div>
                <form class="form" id="mainForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department" required>
                            <option value="">Select a department</option>
                            <option value="sales">Sales</option>
                            <option value="support">Support</option>
                            <option value="development">Development</option>
                            <option value="marketing">Marketing</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Please enter your message here..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="subscribe">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            <span>Subscribe to our newsletter</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </section>

            <!-- Results Section (Right Column) -->
            <section class="results-section">
                <div class="section-header">
                    <h2>Results</h2>
                </div>
                <div class="results-panel" id="resultsPanel">
                    <div class="results-placeholder">
                        <p>Form data will appear here after submission</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
